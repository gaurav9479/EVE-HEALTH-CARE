# src/openapi.yaml
openapi: 3.0.0
info:
  title: EVE Health Care API
  version: "1.0.0"
  description: API for health care centre management, bookings and payments.
servers:
  - url: http://localhost:3000
paths:
  /api/auth/signup:
    post:
      summary: User signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
        '429':
          description: Too Many Requests (rate limit)
  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
  /api/auth/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/centres:
    get:
      summary: List active centres
      parameters:
        - in: query
          name: location
          schema:
            type: string
          description: Optional case‑insensitive location filter
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Centre'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create centre (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCentreRequest'
      responses:
        '201':
          description: Created
  /api/centres/{id}:
    get:
      summary: Get centre details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/bookings:
    get:
      summary: List bookings (user sees own, admin sees all)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Created
  /api/payments/simulate:
    post:
      summary: Simulate payment outcome
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePaymentRequest'
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CreateCentreRequest:
      type: object
      required: [name, location]
      properties:
        name:
          type: string
        location:
          type: string
    Centre:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        location:
          type: string
        isActive:
          type: boolean
        offerings:
          type: array
          items:
            type: object
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    CreateBookingRequest:
      type: object
      required: [centreId, testId, appointmentAt]
      properties:
        centreId:
          type: string
        testId:
          type: string
        appointmentAt:
          type: string
          format: date-time
    Booking:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        centre:
          $ref: '#/components/schemas/Centre'
        test:
          type: object
        appointmentAt:
          type: string
          format: date-time
        amountPaise:
          type: string
        status:
          type: string
    SimulatePaymentRequest:
      type: object
      required: [bookingId, outcome]
      properties:
        bookingId:
          type: string
        outcome:
          type: string
          enum: [SUCCESS, FAILED]
